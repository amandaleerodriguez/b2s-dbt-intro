version: 2
# always specify which version of yml we are using. RN version 2 is the most recent

sources:
  - name: jaffle_shop
    database: demo_db
    schema: raw_jaffle_shop
    tables:
      - name: orders
        freshness:
          warn_after:
            count: 1
            period: day
          error_after:
            count: 2
            period: day
        loaded_at_field: _etl_loaded_at
      - name: customers
      
  - name: stripe
    database: demo_db
    schema: raw_stripe
    tables:
      - name: payment
        columns:
          - name: paymentmethod
         


